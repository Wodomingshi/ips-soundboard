[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ips-soundboard"
version = "0.1.0"
description = "IPS Checker: checks a portfolio against its own Investment Policy Statement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5", "anthropic>=0.70", "pypdf>=4.0"]
llm = ["anthropic>=0.70", "pypdf>=4.0"]
dev = ["pytest>=8.0", "streamlit>=1.40", "altair>=5", "anthropic>=0.70", "pypdf>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ips_soundboard = ["marketdata/*.yaml", "risk/*.yaml", "schemas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
